apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 21-admin-bff-service.yaml
  - 31-admin-gateway.yaml
  - 40-web.yaml
  - 50-ingress.yaml

replicas:
  - name: spring-admin-bff-service
    count: 2
  - name: spring-admin-gateway
    count: 2
  - name: spring-admin-web
    count: 2

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector: {}
                matchLabelKeys:
                  - pod-template-hash
                topologyKey: kubernetes.io/hostname
