apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: spring-msa
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-storage-vm
  namespace: spring-msa
  labels:
    kubernetes.io/service-name: postgres
addressType: IPv4
ports:
  - name: postgres
    protocol: TCP
    port: 5432
endpoints:
  - addresses:
      - 192.168.147.101
    conditions:
      ready: true
---
