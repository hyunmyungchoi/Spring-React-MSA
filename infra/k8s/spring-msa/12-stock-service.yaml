apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-member-stock-service
  namespace: spring-msa
  labels:
    observability.springmsa.dev/scrape: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-member-stock-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8084"
      labels:
        app: spring-member-stock-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      nodeSelector:
        node-pool: application
      containers:
        - name: spring-member-stock-service
          image: ghcr.io/hyunmyungchoi/spring-member-stock-service@sha256:aeeb49d62d0625ad23ac5c418cb1a0ffc05c7d3d8ad2062ae474225748a285e8
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30"
            - name: SERVER_TOMCAT_ACCESSLOG_ENABLED
              value: "true"
            - name: SERVER_TOMCAT_ACCESSLOG_DIRECTORY
              value: /dev
            - name: SERVER_TOMCAT_ACCESSLOG_PREFIX
              value: stdout
            - name: SERVER_TOMCAT_ACCESSLOG_SUFFIX
              value: ""
            - name: SERVER_TOMCAT_ACCESSLOG_FILE_DATE_FORMAT
              value: ""
            - name: SERVER_TOMCAT_ACCESSLOG_BUFFERED
              value: "false"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/postgres
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: spring-msa-config
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-msa-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-msa-secret
                  key: REDIS_PASSWORD
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://user.localtest.me
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://spring-security-authorization-server:9000/oauth2/jwks
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: validate
            - name: SPRING_SQL_INIT_MODE
              value: never
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: SPRING_FLYWAY_CREATE_SCHEMAS
              value: "true"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: stock_service
            - name: SPRING_FLYWAY_DEFAULT_SCHEMA
              value: stock_service
            - name: SPRING_FLYWAY_SCHEMAS
              value: stock_service
            - name: APP_KAFKA_ENABLED
              value: "true"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: spring-msa-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: TOSS_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: spring-msa-config
                  key: TOSS_API_BASE_URL
            - name: TOSS_API_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: spring-msa-secret
                  key: TOSS_API_CLIENT_ID
            - name: TOSS_API_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spring-msa-secret
                  key: TOSS_API_CLIENT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spring-member-stock-service
  namespace: spring-msa
spec:
  type: ClusterIP
  selector:
    app: spring-member-stock-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084

