apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-msa-services
  namespace: observability
  labels:
    app.kubernetes.io/part-of: spring-msa
spec:
  namespaceSelector:
    matchNames:
      - spring-msa
  selector:
    matchLabels:
      observability.springmsa.dev/scrape: "true"
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
