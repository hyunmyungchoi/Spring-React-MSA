apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-msa-security
  namespace: argocd
  labels:
    springmsa.dev/domain: security
spec:
  project: default
  source:
    repoURL: https://github.com/hyunmyungchoi/Spring-React-MSA.git
    targetRevision: master
    path: infra/k8s/spring-msa/security
  destination:
    server: https://kubernetes.default.svc
    namespace: spring-msa
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true