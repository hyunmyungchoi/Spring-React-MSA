apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: kafka
spec:
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kafka-vm
  namespace: kafka
  labels:
    kubernetes.io/service-name: kafka
addressType: IPv4
ports:
  - name: broker
    protocol: TCP
    port: 9092
endpoints:
  - addresses:
      - 192.168.147.131
    conditions:
      ready: true
