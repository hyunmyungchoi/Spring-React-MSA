<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .heading { font: 700 21px Arial, sans-serif; fill: #111827; }
      .body { font: 18px Arial, sans-serif; fill: #374151; }
      .small { font: 16px Arial, sans-serif; fill: #4b5563; }
      .line { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="58" text-anchor="middle" class="title">Pod Sandbox Network Setup</text>

  <rect x="45" y="180" width="170" height="105" rx="16" fill="#eef5ff" stroke="#4a83d8" stroke-width="2"/>
  <text x="130" y="225" text-anchor="middle" class="heading">kubelet</text>
  <text x="130" y="252" text-anchor="middle" class="small">requests sandbox</text>

  <rect x="275" y="180" width="180" height="105" rx="16" fill="#eef9f0" stroke="#55a868" stroke-width="2"/>
  <text x="365" y="218" text-anchor="middle" class="heading">containerd CRI</text>
  <text x="365" y="245" text-anchor="middle" class="small">prepares netns</text>
  <text x="365" y="266" text-anchor="middle" class="small">invokes CNI</text>

  <rect x="515" y="180" width="180" height="105" rx="16" fill="#fff8e8" stroke="#e3a928" stroke-width="2"/>
  <text x="605" y="218" text-anchor="middle" class="heading">CNI Plugin</text>
  <text x="605" y="245" text-anchor="middle" class="small">interface and IP</text>
  <text x="605" y="266" text-anchor="middle" class="small">endpoint handoff</text>

  <rect x="755" y="180" width="180" height="105" rx="16" fill="#f3efff" stroke="#8265d8" stroke-width="2"/>
  <text x="845" y="218" text-anchor="middle" class="heading">Node Agent</text>
  <text x="845" y="245" text-anchor="middle" class="small">Cilium Agent</text>
  <text x="845" y="266" text-anchor="middle" class="small">or Calico Felix</text>

  <rect x="995" y="180" width="160" height="105" rx="16" fill="#fff0f3" stroke="#e6687d" stroke-width="2"/>
  <text x="1075" y="218" text-anchor="middle" class="heading">Kernel</text>
  <text x="1075" y="245" text-anchor="middle" class="small">routes / tunnel</text>
  <text x="1075" y="266" text-anchor="middle" class="small">policy / eBPF</text>

  <path d="M215 220 H265" class="line"/>
  <path d="M455 220 H505" class="line"/>
  <path d="M695 220 H745" class="line"/>
  <path d="M935 220 H985" class="line"/>
  <text x="240" y="200" text-anchor="middle" class="small">1 CRI</text>
  <text x="480" y="200" text-anchor="middle" class="small">2 ADD</text>
  <text x="720" y="200" text-anchor="middle" class="small">3 setup</text>
  <text x="960" y="200" text-anchor="middle" class="small">4 program</text>

  <path d="M1075 300 V365 H845 V295" class="return"/>
  <path d="M845 380 H605 V295" class="return"/>
  <path d="M605 295 V395 H455 V295" class="return"/>
  <text x="960" y="350" text-anchor="middle" class="small">5a datapath ready</text>
  <text x="725" y="365" text-anchor="middle" class="small">5b endpoint result</text>
  <text x="530" y="380" text-anchor="middle" class="small">5c Pod IP and interface</text>

  <path d="M330 285 V430 H460 V445" class="line"/>
  <text x="342" y="418" class="small">after CNI result</text>

  <rect x="275" y="455" width="660" height="105" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="605" y="495" text-anchor="middle" class="heading">6. Start application containers</text>
  <text x="605" y="527" text-anchor="middle" class="body">The runtime starts application containers after network setup succeeds.</text>
</svg>
