<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .heading { font: 700 24px Arial, sans-serif; fill: #111827; }
      .body { font: 18px Arial, sans-serif; fill: #374151; }
      .small { font: 16px Arial, sans-serif; fill: #4b5563; }
      .line { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="58" text-anchor="middle" class="title">Kubernetes Network Model and CNI Boundary</text>

  <rect x="55" y="135" width="330" height="410" rx="22" fill="#eef5ff" stroke="#4a83d8" stroke-width="2"/>
  <text x="220" y="180" text-anchor="middle" class="heading">Kubernetes requires</text>
  <rect x="90" y="220" width="260" height="58" rx="12" fill="#ffffff" stroke="#9dbbe8" stroke-width="2"/>
  <text x="220" y="255" text-anchor="middle" class="body">Unique Pod IP</text>
  <rect x="90" y="300" width="260" height="58" rx="12" fill="#ffffff" stroke="#9dbbe8" stroke-width="2"/>
  <text x="220" y="335" text-anchor="middle" class="body">Pod-to-Pod reachability</text>
  <rect x="90" y="380" width="260" height="58" rx="12" fill="#ffffff" stroke="#9dbbe8" stroke-width="2"/>
  <text x="220" y="415" text-anchor="middle" class="body">No NAT between Pods</text>
  <rect x="90" y="460" width="260" height="58" rx="12" fill="#ffffff" stroke="#9dbbe8" stroke-width="2"/>
  <text x="220" y="495" text-anchor="middle" class="body">Node agents reach local Pods</text>

  <rect x="450" y="205" width="300" height="270" rx="22" fill="#fff8e8" stroke="#e3a928" stroke-width="2"/>
  <text x="600" y="250" text-anchor="middle" class="heading">CNI Specification</text>
  <text x="600" y="290" text-anchor="middle" class="body">Runtime-to-plugin contract</text>
  <text x="600" y="330" text-anchor="middle" class="small">ADD / DEL / CHECK</text>
  <text x="600" y="360" text-anchor="middle" class="small">STATUS / GC / VERSION</text>
  <text x="600" y="410" text-anchor="middle" class="body">Defines the interface</text>
  <text x="600" y="438" text-anchor="middle" class="body">not the datapath design</text>

  <rect x="815" y="135" width="330" height="410" rx="22" fill="#f3efff" stroke="#8265d8" stroke-width="2"/>
  <text x="980" y="180" text-anchor="middle" class="heading">Implementations choose</text>
  <rect x="850" y="220" width="260" height="70" rx="12" fill="#ffffff" stroke="#b7a7e8" stroke-width="2"/>
  <text x="980" y="250" text-anchor="middle" class="heading">Flannel</text>
  <text x="980" y="274" text-anchor="middle" class="small">VXLAN or host-gw</text>
  <rect x="850" y="315" width="260" height="70" rx="12" fill="#ffffff" stroke="#b7a7e8" stroke-width="2"/>
  <text x="980" y="345" text-anchor="middle" class="heading">Calico</text>
  <text x="980" y="369" text-anchor="middle" class="small">BGP, VXLAN, policy</text>
  <rect x="850" y="410" width="260" height="70" rx="12" fill="#ffffff" stroke="#b7a7e8" stroke-width="2"/>
  <text x="980" y="440" text-anchor="middle" class="heading">Cilium</text>
  <text x="980" y="464" text-anchor="middle" class="small">eBPF datapath</text>

  <path d="M385 340 H440" class="line"/>
  <path d="M750 340 H805" class="line"/>
  <text x="412" y="322" text-anchor="middle" class="small">contract</text>
  <text x="778" y="322" text-anchor="middle" class="small">implemented by</text>
</svg>
